<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Composição base (5 s, 3 cenas)</title>
<style>
  /* Tamanho do vídeo: 1080x1920 vertical, 1920x1080 horizontal, 1080x1080 quadrado */
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #14100d; }
  #palco { position: relative; width: 1080px; height: 1920px; overflow: hidden;
    background: radial-gradient(900px 900px at 50% 40%, #3a2517, #14100d 70%);
    font-family: "DejaVu Sans", "Liberation Sans", Arial, sans-serif; color: #fff4e6; }
  /* Margem segura: 90px dos lados, 160px em cima e embaixo. Elementos animados começam centralizados. */
  .el { position: absolute; left: 0; top: 0; will-change: transform, opacity; }
  .centro { left: 90px; width: 900px; text-align: center; }
  .titulo { font-size: 150px; font-weight: 800; line-height: 1.05; letter-spacing: -2px; }
  .sub { font-size: 56px; font-weight: 500; line-height: 1.25; color: #e8c9a4; }
  .acento { color: #ff9a3c; }
  .forma { border-radius: 50%; }
</style>
</head>
<body>
<div id="palco">
  <!-- Cena 1 (0 a 1.8 s): a bolinha vira a xícara -->
  <div class="el forma" id="bola" style="width:200px;height:200px;background:#ff9a3c"></div>
  <div class="el centro titulo" id="t1" style="top:700px">Café<br><span class="acento">acorda</span></div>
  <!-- Cena 2 (1.8 a 3.6 s): três números -->
  <div class="el centro titulo" id="t2" style="top:760px">3 xícaras</div>
  <div class="el centro sub" id="s2" style="top:1000px">por dia já mudam o seu foco</div>
  <!-- Cena 3 (3.6 a 5 s): fecho -->
  <div class="el centro titulo" id="t3" style="top:780px">Bom dia,<br><span class="acento">mundo</span></div>
</div>

<script>
/* ================= Mini motor de timeline (não mexa aqui) ================= */
window.__duracao = 5;               // segundos
window.__tamanho = [1080, 1920];    // largura, altura

const easings = {
  linear: x => x,
  suave: x => x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2,          // easeInOutCubic
  saida: x => 1 - Math.pow(1 - x, 3),                                       // easeOutCubic
  entrada: x => x * x * x,                                                  // easeInCubic
  elastico: x => x === 0 ? 0 : x === 1 ? 1 : Math.pow(2, -10*x) * Math.sin((x*10 - .75) * (2*Math.PI/3)) + 1,
  volta: x => 1 + 2.70158 * Math.pow(x-1, 3) + 1.70158 * Math.pow(x-1, 2)  // easeOutBack
};
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const mix = (a, b, k) => a + (b - a) * k;
/* tween(t, inicio, fim, de, para, easing): valor de 'de' a 'para' entre inicio e fim (s). */
function tween(t, ini, fim, de, para, easing = 'suave') {
  const k = clamp((t - ini) / (fim - ini), 0, 1);
  return mix(de, para, easings[easing](k));
}
/* pose(id, {x, y, escala, rot, op, w, h}): aplica o estado do elemento naquele instante. */
function pose(id, e) {
  const el = document.getElementById(id);
  const { x = 0, y = 0, escala = 1, rot = 0, op = 1, w, h, raio } = e;
  el.style.opacity = op;
  el.style.visibility = op <= 0.001 ? 'hidden' : 'visible';
  el.style.transform = `translate(${x}px, ${y}px) rotate(${rot}deg) scale(${escala})`;
  if (w !== undefined) el.style.width = w + 'px';
  if (h !== undefined) el.style.height = h + 'px';
  if (raio !== undefined) el.style.borderRadius = raio + 'px';
}

/* ================= Sua animação: edite só esta função ================= */
window.__render = function (t) {
  // Cena 1 (0 a 1.8): bolinha cai, vira retângulo (xícara) e sai para virar o título da cena 2
  const bx = 440;                                           // centro horizontal (1080-200)/2 = 440
  const by = tween(t, 0, .7, -300, 1100, 'saida');          // cai até o centro
  const bw = tween(t, .6, 1.2, 200, 420, 'volta');          // vira xícara (mais larga)
  const bh = tween(t, .6, 1.2, 200, 300, 'volta');
  const br = tween(t, .6, 1.2, 100, 60, 'suave');
  const bsai = tween(t, 1.5, 2.0, 0, 1, 'entrada');         // transforma: cresce e some na cena 2
  pose('bola', {
    x: bx - (bw - 200) / 2, y: by - bsai * 300, w: bw, h: bh, raio: br,
    escala: 1 + bsai * 1.2, op: 1 - clamp((t - 1.7) / .3, 0, 1)
  });
  const t1in = tween(t, .9, 1.4, 60, 0, 'saida');
  pose('t1', { y: t1in - tween(t, 1.5, 1.9, 0, 120, 'entrada'),
    op: clamp((t - .9) / .3, 0, 1) * (1 - clamp((t - 1.6) / .25, 0, 1)) });

  // Cena 2 (1.8 a 3.6): título entra subindo, subtítulo logo depois
  pose('t2', { y: tween(t, 1.8, 2.3, 80, 0, 'saida') - tween(t, 3.3, 3.7, 0, 100, 'entrada'),
    escala: tween(t, 1.8, 2.3, .9, 1, 'volta'),
    op: clamp((t - 1.8) / .25, 0, 1) * (1 - clamp((t - 3.4) / .25, 0, 1)) });
  pose('s2', { y: tween(t, 2.2, 2.7, 50, 0, 'saida') - tween(t, 3.3, 3.7, 0, 60, 'entrada'),
    op: clamp((t - 2.2) / .3, 0, 1) * (1 - clamp((t - 3.4) / .25, 0, 1)) });

  // Cena 3 (3.6 a 5): fecho com leve zoom que segue até o fim
  pose('t3', { y: tween(t, 3.6, 4.1, 80, 0, 'saida'),
    escala: tween(t, 3.6, 5, .94, 1.03, 'linear'),
    op: clamp((t - 3.6) / .3, 0, 1) });
};
window.__render(0);
</script>
</body>
</html>
